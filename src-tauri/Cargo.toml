[package]
name = "rafferty"
version = "0.1.0"
description = "A lightweight Windows network utility"
authors = ["Rafferty contributors"]
edition = "2021"

[lib]
name = "rafferty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

